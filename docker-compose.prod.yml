services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecom_backend_prod
    restart: always
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    # In production, we don't map volumes for source code to prevent runtime changes
    volumes:
      - ./logs:/app/logs
    # Using db push to ensure schema alignment during initial production conversion
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed && npm start"

  db:
    image: postgres:15-alpine
    container_name: ecom_db_prod
    restart: always
    env_file:
      - .env.production
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  # Optional: Reverse proxy for SSL (Nginx)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #   depends_on:
  #     - app

volumes:
  postgres_prod_data:
